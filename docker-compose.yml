services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fantasy_gm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fantasy_gm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    volumes:
      - ./scripts/yahoo-observer:/opt/court-iq-observer:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fantasy_gm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fantasy_gm}
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:-}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:-}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:-http://localhost:${API_PORT:-18002}/api/v1/yahoo/oauth/callback}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      WAIVER_MANAGER_TEAM_KEY: ${WAIVER_MANAGER_TEAM_KEY:-478.l.50505.t.9}
      COURT_IQ_OBSERVER_SECRET: ${COURT_IQ_OBSERVER_SECRET:-}
      COURT_IQ_OBSERVER_PRACTICE_SESSION: ${COURT_IQ_OBSERVER_PRACTICE_SESSION:-}
      COURT_IQ_OBSERVER_LEAGUE_KEY: ${COURT_IQ_OBSERVER_LEAGUE_KEY:-}
      COURT_IQ_OBSERVER_ORIGIN: ${COURT_IQ_OBSERVER_ORIGIN:-}
      COURT_IQ_OBSERVER_PRACTICE_WRITES: ${COURT_IQ_OBSERVER_PRACTICE_WRITES:-false}
      COURT_IQ_OBSERVER_MOCK_ROUNDS: ${COURT_IQ_OBSERVER_MOCK_ROUNDS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_LIVE_DRAFT_POLL_INTERVAL_MS: ${LIVE_DRAFT_POLL_INTERVAL_MS:-60000}
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-192.168.0.85}
    ports:
      - "0.0.0.0:${API_PORT:-18002}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config: